<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tabTitle">The Brother Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="setupScreen" class="setup-screen">
        <div class="setup-card">
            <h2>What is your name?</h2>
            <input type="text" id="nameSetupInput" placeholder="Enter name...">
            <button id="saveBtn">CONFIRM</button>
        </div>
    </div>
    <div class="chat-container">
        <div class="chat-header">
            <span id="chatTitle">THE BROTHER CHAT</span>
            <div class="status-container">
                <button id="clrBtn">CLEAR</button>
                <button id="dlBtn">SAVE LOG</button>
                <button id="dndBtn">DND</button>
                <span id="statusText">OFFLINE</span>
                <span id="statusIndicator" class="status-dot"></span>
            </div>
        </div>
        <div class="chat-messages" id="chatBox"></div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Transmit data stream...">
            <button id="sendBtn">SEND</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
